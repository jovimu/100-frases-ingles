    h1 { font-size: 1.4rem; color: #1a73e8; margin-top: 0; text-align: center; }
    .category-select, .phrase-select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 0.95rem; margin-bottom: 15px; }
    .box { background: #f8f9fa; border-left: 4px solid #1a73e8; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
    .label { font-size: 0.75rem; text-transform: uppercase; color: #5f6368; font-weight: bold; margin-bottom: 4px; }
    .text-en { font-size: 1.1rem; font-weight: bold; color: #202124; }
    .text-es { font-size: 0.95rem; color: #5f6368; margin-top: 4px; }
    .phonetic { font-size: 0.9rem; color: #d93025; font-style: italic; margin-top: 6px; }
    .controls { display: flex; gap: 10px; margin-top: 15px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    .btn-listen { background: #e8f0fe; color: #1a73e8; }
    .btn-listen:hover { background: #d2e3fc; }
    .btn-speak { background: #1a73e8; color: white; }
    .btn-speak:hover { background: #1557b0; }
    .btn-speak.recording { background: #d93025; animation: pulse 1.5s infinite; }
    .result { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; font-size: 0.9rem; display: none; }
    .success { background: #e6f4ea; color: #137333; }
    .retry { background: #fce8e6; color: #c5221f; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  </style>
</head>

  <div id="resultBox" class="result"></div>

  let currentCategory = 'cat1';
  let currentPhraseIndex = 0;
  let isRecording = false;
  let recognition;

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      const speechToText = event.results[0][0].transcript;
      evaluateSpeech(speechToText);
    };

    recognition.onerror = () => {
      showResult("No se pudo procesar el audio. Inténtalo de nuevo.", false);
      stopRecording();
    };

    recognition.onend = () => {
      stopRecording();
    };
  }

  function loadCategory() {
    currentCategory = document.getElementById('categorySelect').value;
    const phraseSelect = document.getElementById('phraseSelect');
    phraseSelect.innerHTML = '';
    
    fullData[currentCategory].forEach((item, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.innerText = `Frase ${index + 1}: ${item.qEs.substring(0, 40)}...`;
      phraseSelect.appendChild(option);
    });

    currentPhraseIndex = 0;
    loadPhrase();
  }

  function loadPhrase() {
    currentPhraseIndex = parseInt(document.getElementById('phraseSelect').value) || 0;
    const item = fullData[currentCategory][currentPhraseIndex];
    
    document.getElementById('aiTextEn').innerText = item.qEn;
    document.getElementById('aiTextEs').innerText = item.qEs;
    document.getElementById('userTextEn').innerText = item.aEn;
    document.getElementById('userTextEs').innerText = item.aEs;
    document.getElementById('userPhonetic').innerText = "Pronunciación: " + item.phon;
    
    document.getElementById('resultBox').style.display = 'none';
  }

  function playAI() {
    const item = fullData[currentCategory][currentPhraseIndex];
    const utterance = new SpeechSynthesisUtterance(item.qEn);
    utterance.lang = 'en-US';
    window.speechSynthesis.speak(utterance);
  }

  function toggleRecognition() {
    if (!recognition) {
      alert("Tu navegador no soporta el reconocimiento de voz. Por favor usa Google Chrome.");
      return;
    }
    if (!isRecording) {
      recognition.start();
      isRecording = true;
      const btn = document.getElementById('recordBtn');
      btn.innerText = "🛑 Escuchando tu voz...";
      btn.classList.add('recording');
    } else {
      recognition.stop();
      stopRecording();
    }
  }

  function stopRecording() {
    isRecording = false;
    const btn = document.getElementById('recordBtn');
    btn.innerText = "🎙️ Presiona para Hablar";
    btn.classList.remove('recording');
  }

  function evaluateSpeech(textDicho) {
    const item = fullData[currentCategory][currentPhraseIndex];
    const esperado = item.aEn.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
    const obtenido = textDicho.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");

    if (obtenido.includes(esperado) || esperado.includes(obtenido)) {
      showResult(`¡Excelente! Pronunciaste: "${textDicho}"`, true);
    } else {
      showResult(`Entendido: "${textDicho}". Intenta repetir ajustando la pronunciación.`, false);
    }
  }

  function showResult(msg, isSuccess) {
    const box = document.getElementById('resultBox');
    box.innerText = msg;
    box.className = "result " + (isSuccess ? "success" : "retry");
    box.style.display = 'block';
  }

  // Inicializar al cargar la página
  window.onload = loadCategory;
</script>
